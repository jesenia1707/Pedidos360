<div class="app">

  <!-- ================================================= -->
  <!-- PÁGINA PRINCIPAL / LOGIN -->
  <!-- ================================================= -->

  <ng-container *ngIf="isHomePage">

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

      <div class="brand">

        <div class="brand-icon">
          P
        </div>

        <div>
          <h1>Pedidos360</h1>
          <span>Gestión inteligente</span>
        </div>

      </div>

      <div
        class="navbar-right"
        *ngIf="isAuthenticated">

        <div class="user-status">

          <span class="online-dot"></span>

          Sesión activa

        </div>

        <button
          type="button"
          class="logout-small"
          (click)="logout()">

          Cerrar sesión

        </button>

      </div>

    </header>


    <!-- ================= CONTENIDO ================= -->

    <main class="main-content">

      <!-- ================= LOGIN ================= -->

      <div
        *ngIf="!isAuthenticated"
        class="login-container">

        <div class="decor decor-one"></div>

        <div class="decor decor-two"></div>

        <section class="login-card">

          <div class="login-logo">
            <span>♡</span>
          </div>

          <p class="small-title">
            BIENVENIDA A
          </p>

          <h2>
            Pedidos<span>360</span>
          </h2>

          <p class="login-description">
            Gestiona tus pedidos y productos
            de manera simple y segura.
          </p>

          <button
            type="button"
            class="login-button"
            (click)="login()">

            <span>
              Iniciar sesión
            </span>

            <strong>
              →
            </strong>

          </button>

          <p class="secure-text">
            🔒 Acceso seguro mediante AWS Cognito
          </p>

        </section>

      </div>


      <!-- ================= REDIRECCIÓN ================= -->

      <div
        *ngIf="isAuthenticated"
        class="redirect-message">

        <div class="redirect-icon">
          ✨
        </div>

        <h2>
          Bienvenido a Pedidos360
        </h2>

        <p>
          Cargando tu espacio de trabajo...
        </p>

      </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

      <span>
        Pedidos360 · Sistema de gestión
      </span>

      <span>
        2026
      </span>

    </footer>

  </ng-container>


  <!-- ================================================= -->
  <!-- RUTAS: ADMIN / CLIENTE / COLABORADOR -->
  <!-- ================================================= -->

  <router-outlet></router-outlet>

</div>

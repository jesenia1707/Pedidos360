name: Build and Deploy Productos

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Productos
        working-directory: productos
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "productos/build/libs/*.jar"
          target: "/home/ec2-user/productos"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Productos en EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Conectado a EC2"

            cd /home/ec2-user/productos

            echo "Deteniendo aplicación anterior..."
            pkill -f "/home/ec2-user/productos/productos-.*\.jar" || true

            echo "Iniciando Productos..."
            nohup java -jar productos-0.0.1-SNAPSHOT.jar > productos.log 2>&1 &

            echo "Productos iniciado"
            sleep 5

            echo "Procesos activos:"
            ps aux | grep productos
name: Build and Deploy Pedidos360

on:
  push:
    branches:
      - main

jobs:

  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - pedidos
          - productos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build application
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew && ./gradlew clean build -x test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pedidos360-${{ matrix.service }}:latest


  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Conectado a EC2"
            docker --version
            docker ps

            echo "Actualizando imagen Pedidos"
            docker pull ghcr.io/jesenia1707/pedidos360-pedidos:latest

            echo "Actualizando imagen Productos"
            docker pull ghcr.io/jesenia1707/pedidos360-productos:latest

            echo "EC2 conectada correctamente"